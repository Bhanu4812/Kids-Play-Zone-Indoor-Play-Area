<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Page Not Found | WonderNest Play</title>
        <meta name="description" content="The requested WonderNest Play page could not be found." />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/rtl.css" />
        <script src="../assets/js/theme.js"></script>
    </head>
    <body>
        <main class="special-page utility-page--404">
            <div class="special-corner-tools" aria-label="Display controls">
                <button class="utility-button" data-theme-toggle aria-label="Toggle dark mode">
                    ◐
                </button>
                <button class="utility-button direction-toggle" data-direction-toggle>RTL</button>
            </div>
            <div class="special-grid">
                <section class="special-copy">
                    <span class="error-number">404</span>
                    <span class="eyebrow">Wrong turn</span>
                    <h1>Oops! This Play Area Doesn't Exist</h1>
                    <p class="lead">
                        The page you're looking for may have moved or no longer exists.
                    </p>
                    <div class="button-row">
                        <a class="btn btn-primary" href="index.html">Go Home</a>
                        <button class="btn btn-outline" type="button" onclick="history.back()">
                            Back
                        </button>
                    </div>
                </section>
                <div class="special-visual">
                    <img
                        src="../assets/images/misc/404-playground.webp"
                        alt="A quiet indoor playground pathway"
                    />
                    <div class="visual-note">
                        <strong>Lost your way?</strong>
                        <span>Let’s get your family back to the fun.</span>
                    </div>
                </div>
            </div>
        </main>
        <script src="../assets/js/page-controls.js"></script>
    </body>
</html>

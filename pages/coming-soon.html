<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Coming Soon | WonderNest Play</title>
        <meta name="description" content="Something fun is coming soon at WonderNest Play." />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/rtl.css" />
        <script src="../assets/js/theme.js"></script>
        <link rel="icon" type="image/svg+xml" href="../assets/images/brand-mark.svg" />
        <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="../assets/images/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
        <link rel="stylesheet" href="../assets/css/buttons.css" />
    </head>
    <body>
        <main class="special-page utility-page--coming">
            <div class="special-corner-tools" aria-label="Display controls">
                <button class="utility-button" data-theme-toggle aria-label="Toggle dark mode">
                    ◐
                </button>
                <button class="utility-button direction-toggle" data-direction-toggle>RTL</button>
            </div>
            <div class="special-grid">
                <section class="special-copy">
                    <span class="pill">Coming Soon</span>
                    <h1>Something Fun Is Coming Soon</h1>
                    <p class="lead">We’re preparing a fresh play experience for local families.</p>
                    <div class="countdown" data-countdown>
                        <div>
                            <strong data-days>00</strong>
                            Days
                        </div>
                        <div>
                            <strong data-hours>00</strong>
                            Hours
                        </div>
                        <div>
                            <strong data-minutes>00</strong>
                            Minutes
                        </div>
                        <div>
                            <strong data-seconds>00</strong>
                            Seconds
                        </div>
                    </div>
                    <form class="notify-form">
                        <div class="field">
                            <label for="notify-email">Email notification</label>
                            <input
                                id="notify-email"
                                type="email"
                                placeholder="parent@example.com"
                                required
                            />
                        </div>
                        <button class="btn btn-primary">Notify Me</button>
                    </form>
                </section>
                <div class="special-visual">
                    <img
                        src="../assets/images/misc/coming-soon-play.webp"
                        alt="A bright new indoor play center"
                    />
                    <div class="visual-note">
                        <span class="eyebrow">Launching soon</span>
                        <strong>A New Way to Play</strong>
                        <span>Age-based zones, instant booking and birthday benefits.</span>
                        <div>
                            <span class="pill">Safe Play</span>
                            <span class="pill">Instant Booking</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="../assets/js/special-pages.js"></script>
    </body>
</html>
